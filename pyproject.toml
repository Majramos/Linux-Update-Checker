[project]
name = "linux-update-checker"
version = "0.3.0"
description = "Check for updates in linux and send a notification"
readme = "README.md"
authors = [
    { name = "Marco Ramos", email = "linux_update_checker@marcoramos.me" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
linux-update-checker = "linux_update_checker:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py313"
include = [
    "src/**/*.py",
    "tests/**/*.py"
]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true

[tool.pytest.ini_options]
addopts = [
    "--verbose",
    "--cov=linux_update_checker",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=60"
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["linux_update_checker"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "@abc.abstractmethod",
    "raise NotImplementedError",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
